# Pathfinder with a real pgvector backend.
#
#   docker compose up --build
#   open http://localhost:8300
#
# Without Postgres the app runs identically on the numpy store - at 822 documents an
# exact scan is faster than any approximate index. The pgvector service exists to prove
# the backend is real, not because the corpus needs it.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder
      POSTGRES_DB: pathfinder
    ports: ["5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports: ["8300:8300"]
    environment:
      PATHFINDER_PG_DSN: postgresql://pathfinder:pathfinder@postgres:5432/pathfinder
      # No key needed. With one set, the agent uses a real API model instead of the
      # local flan-t5 - and the format finding is expected to disappear, which is the
      # honest scope of that result.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
